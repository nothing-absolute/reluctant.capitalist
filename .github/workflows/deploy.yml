name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a superseded build is wasted minutes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The working copy lives on eFAT, where npm cannot link binaries, so the
      # install is done in /tmp and copied back dereferenced. On a CI runner
      # (ext4) a plain `npm ci` is fine, so use it directly.
      - run: npm ci

      # This is a *project* Pages site, so it is served from
      # /reluctant.capitalist/, not the domain root. Without this, astro emits
      # root-absolute links (/blog/...) that 404 off-prefix.
      - run: npm run build
        env:
          PAGES_BASE: /reluctant.capitalist

      # Astro rewrites its own links for `base` but not literal <img src="/...">
      # inside markdown, so media paths still need the prefix.
      - run: node scripts/fix-base-media.mjs
        env:
          PAGES_BASE: /reluctant.capitalist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
